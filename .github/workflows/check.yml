name: Проверка карточек

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --check app.js
      - run: node --check tests/app.test.cjs
      - run: python tests/audio_test.py
      - name: Browser regression (changed lessons for PR, full weekly/on demand)
        run: node tests/app.test.cjs
        env:
          CI_FAST: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: test-output/
