name: Озвучка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Кэш озвучки
        uses: actions/cache@v4
        with:
          path: _site/audio
          key: audio-${{ hashFiles('decks/*.json', 'scripts/gen_audio.py') }}
          restore-keys: audio-

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css decks _site/
          touch _site/.nojekyll

      - name: Сгенерировать озвучку
        run: |
          pip install edge-tts
          python scripts/gen_audio.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
